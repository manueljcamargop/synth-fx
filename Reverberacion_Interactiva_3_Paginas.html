<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081423"><meta name="application-name" content="Audio Pedagógico"><meta name="application-version" content="0.3-preview-autonoma"><title>Audio Pedagógico · Reverberación</title>
<style>:root{color-scheme:dark;--bg:#081423;--panel:#101d2f;--panel2:#15283b;--stroke:#294359;--text:#f0f8ff;--muted:#a6bbcc;--cyan:#70e7d9;--blue:#69bfe9;--amber:#ffd37b;--ok:#9befc4}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 86% 0%,#16445377,transparent 46%),radial-gradient(ellipse at 5% 80%,#1c264477,transparent 52%),var(--bg);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);min-height:100vh}a{color:var(--cyan)}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.shell{width:min(1170px,calc(100% - 36px));margin:auto;padding-bottom:54px}.topline{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--stroke);font-size:.77rem;color:var(--muted)}.topline strong{color:var(--cyan)}.brand{display:flex;gap:12px;align-items:center;margin-top:26px}.mark{width:43px;height:43px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#9ef4df,#4db7e0);color:#0b2936;font-size:1.65rem;font-weight:900;box-shadow:0 8px 33px #4ecfda30}.brand-title{font-size:1.32rem;font-weight:850}.brand-sub{font-size:.68rem;letter-spacing:.12em;color:var(--muted)}.eyebrow{font-size:.76rem;letter-spacing:.12em;color:var(--cyan);font-weight:800;text-transform:uppercase}.hero{margin:25px 0 18px}.hero h1{font-size:clamp(2.3rem,5vw,3.85rem);letter-spacing:-.055em;line-height:1.07;margin:6px 0}.hero h1 em{font-style:normal;color:var(--cyan)}.hero p{max-width:710px;color:var(--muted);margin:0}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.chip{border:1px solid var(--stroke);border-radius:40px;color:#cadde8;background:#132339;padding:5px 10px;font-size:.75rem}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 17px}.step{min-height:66px;text-decoration:none;display:flex;align-items:center;gap:12px;background:#102034;border:1px solid #29455b;border-radius:13px;padding:11px 16px;color:#c7daea;font-weight:770}.step .number{font-size:.73rem;color:var(--cyan);font-weight:850}.step small{display:block;font-size:.69rem;color:var(--muted);font-weight:550}.step[aria-current="page"]{background:#16414b;border-color:#59cfc8;color:white;box-shadow:inset 0 0 0 1px #48a9a8}
.layout{display:grid;grid-template-columns:minmax(0,1.42fr) minmax(318px,.96fr);gap:16px;align-items:start}.panel{border:1px solid var(--stroke);border-radius:20px;background:linear-gradient(150deg,#12243a,#101b2e);padding:20px;min-width:0}.visual-panel{display:flex;flex-direction:column;gap:14px}.panel h2,.panel h3{margin:0;letter-spacing:-.025em}.panel h2{font-size:1.5rem}.panel h3{font-size:1.04rem}.subtle{color:var(--muted);font-size:.87rem}.panel-heading{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.stage-tag{border:1px solid #5f765d;background:#273c32;color:#b6f7d4;padding:5px 10px;font-size:.69rem;border-radius:99px;white-space:nowrap;font-weight:760}.scene{background:#071320;border:1px solid #294e64;border-radius:14px;overflow:hidden;position:relative}.scene canvas{width:100%;height:auto;aspect-ratio:16/9;display:block}.scene .scene-tag{position:absolute;top:12px;left:12px;background:#091724ce;color:#cce8ee;padding:5px 9px;font-size:.65rem;letter-spacing:.10em;font-weight:800;border-radius:7px}.legend{display:flex;align-items:center;gap:15px;flex-wrap:wrap;color:#a9c4d4;font-size:.75rem}.key{width:10px;height:10px;display:inline-block;margin-right:5px;border-radius:50%}.key.direct{background:#ffd37b}.key.reflect{background:#70e7d9}
.insight{display:flex;gap:12px;align-items:flex-start;background:#0d2c39;border:1px solid #2b6670;border-radius:13px;padding:13px;color:#d5f4f7;font-size:.89rem}.insight b{color:#90f4df}.insight .bulb{font-size:1.3rem}.compare{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.btn{border:1px solid #3e6076;background:#19364b;color:#e8f7ff;padding:11px 14px;border-radius:11px;font-weight:770;min-height:44px;transition:background .15s;text-decoration:none;text-align:center;display:inline-flex;justify-content:center;align-items:center}.btn:hover{background:#23506a}.btn.primary{background:linear-gradient(130deg,#9aefdf,#58c9de);color:#0a2d37;border-color:#7eebdc}.btn.primary:hover{filter:brightness(1.05)}.btn:active{transform:translateY(1px)}.btn.small{font-size:.83rem;padding:9px 11px;min-height:39px}.btn.ghost{background:transparent}.hint{font-size:.76rem;color:#9eb5c4;margin:0}
.audio-bar{margin-top:16px;background:#0a1829;border:1px solid #2d4d64;border-radius:13px;padding:12px}.audio-bar label{display:block;color:#c8dae7;font-size:.8rem;font-weight:760;margin-bottom:9px}.sounds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sound{border-radius:9px;border:1px solid #375369;background:#142a3d;color:#cde2ed;padding:9px 7px;min-height:39px;font-size:.77rem}.sound[aria-pressed=true]{background:#155259;border-color:#66e7db;color:white}.upload{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px}.upload label{border:1px dashed #4f7887;padding:8px 11px;border-radius:9px;color:#addbdc;cursor:pointer;font-size:.78rem;font-weight:650;margin:0}.upload input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}.upload-name{color:#91aebf;font-size:.73rem;overflow-wrap:anywhere}
.console{display:flex;gap:8px;margin:14px 0 0;flex-wrap:wrap}.status{color:#b5ead9;font-size:.75rem;min-height:22px;margin-top:9px}.control{background:#0b1b2b;border:1px solid #29475d;border-radius:13px;padding:12px 14px;margin-top:10px}.control label{display:flex;justify-content:space-between;gap:10px;font-size:.83rem;font-weight:760}.control output{color:var(--cyan);font-variant-numeric:tabular-nums}.control input[type=range]{width:100%;accent-color:#67e4d8;margin:11px 0 0;cursor:pointer;touch-action:pan-y}.control .desc{color:#8eaabb;font-size:.73rem;margin-top:5px}.control-summary{color:var(--muted);font-size:.87rem;margin-top:7px}.moods,.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0}.mood{background:#102b3c;border:1px solid #355a6d;border-radius:11px;padding:11px 5px;color:#d3e5f0;text-align:center;font-size:.78rem;font-weight:730}.mood[aria-pressed=true]{background:#15464a;border-color:#76e7d6;color:#fff}
.plot{border-radius:12px;border:1px solid #32536b;background:#071725;overflow:hidden}.plot canvas{display:block;width:100%;height:auto;aspect-ratio:2.8/1}.plot-caption{display:flex;justify-content:space-between;gap:10px;color:#94b3c5;font-size:.73rem;margin-top:6px}.scenario{border:1px solid #375870;background:#132b3e;border-radius:12px;padding:13px 9px;color:#d4ebf1;text-align:left;min-height:88px}.scenario strong{display:block;font-size:.84rem}.scenario span{display:block;color:#a5c5d2;font-size:.73rem;margin-top:4px}.scenario[aria-pressed=true]{border-color:#7aead9;background:#164550}.banner{background:linear-gradient(105deg,#123748,#17334a);border:1px solid #2f7180;padding:15px;border-radius:13px}.banner strong{color:#a3ffec}.banner p{color:#d2e8ec;font-size:.87rem;margin:5px 0 0}.footnote{border-top:1px solid #274355;padding-top:16px;margin-top:28px;color:#8daabb;font-size:.78rem}.pager{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:17px}.pager .subtle{font-size:.81rem}.mini-info{font-size:.82rem;color:#a9c6d6;margin-top:8px}.room-info{color:#abe6d8;font-size:.84rem;min-height:19px}details{background:#0b1c2d;border-radius:12px;border:1px solid #29485e;padding:10px 13px;margin-top:13px}summary{cursor:pointer;font-weight:730;font-size:.83rem;color:#b9e9e3}details p{color:#b2ccda;font-size:.8rem;margin-bottom:0}
@media(max-width:920px){.layout{grid-template-columns:1fr}.panel{padding:16px}}@media(max-width:620px){.shell{width:min(100% - 24px,1170px)}.steps{gap:5px}.step{padding:10px 8px;min-height:62px;gap:7px;font-size:.79rem}.step small{font-size:.63rem}.cards{grid-template-columns:1fr}.scenario{min-height:50px}.hero h1{font-size:2.3rem}.moods{gap:5px}.mood{padding:9px 2px;font-size:.72rem}.panel h2{font-size:1.33rem}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}

.home-link{display:inline-flex;align-items:center;min-height:44px;font-weight:750}
.topline{align-items:center;padding:4px 0}
@media(max-width:380px){.step small{display:none}.panel-heading{flex-wrap:wrap}}

<script>
const REV_PAGES = ["<div class=\"shell\">\n<nav class=\"topline\" aria-label=\"Navegación general\"><a class=\"home-link\" href=\"reverberacion.html\">← Reverberación<\/a><span>Laboratorio interactivo de diseño sonoro<\/span><\/nav>\n<header><div class=\"brand\"><div class=\"mark\" aria-hidden=\"true\">⌁<\/div><div><div class=\"brand-title\">Reverberación<\/div><div class=\"brand-sub\">ESCUCHA · OBSERVA · EXPERIMENTA<\/div><\/div><\/div>\n<div class=\"hero\"><div class=\"eyebrow\">Parte 01 de 03 · Observa<\/div><h1 tabindex=\"-1\">¿Cómo suena un <em>espacio?<\/em><\/h1><p>Una palmada puede sonar muy diferente según el lugar. Escucha cómo aparecen las reflexiones.<\/p><div class=\"chips\"><span class=\"chip\">🎧 Audífonos recomendados<\/span><span class=\"chip\">◉ Audio procesado en el navegador<\/span><span class=\"chip\">01/03<\/span><\/div><\/div><\/header>\n<nav class=\"steps\" aria-label=\"Páginas de reverberación\"><a class=\"step\" href=\"#observa\" aria-current=\"page\"><span class=\"number\">01<\/span><span>Observa<small>Escucha las reflexiones<\/small><\/span><\/a><a class=\"step\" href=\"#experimenta\" ><span class=\"number\">02<\/span><span>Experimenta<small>Modifica el sonido<\/small><\/span><\/a><a class=\"step\" href=\"#aplica\" ><span class=\"number\">03<\/span><span>Aplica<small>Construye un espacio<\/small><\/span><\/a><\/nav><main class=\"layout\"><section class=\"panel visual-panel\" aria-labelledby=\"head-observe\"><div class=\"panel-heading\"><div><div class=\"eyebrow\">01 · Observa<\/div><h2 id=\"head-observe\">Un sonido. Distintos espacios.<\/h2><\/div><span class=\"stage-tag\">Sonido y reflexiones<\/span><\/div>\n<div class=\"scene\"><canvas id=\"room-canvas\" width=\"960\" height=\"540\" role=\"img\" aria-label=\"Diagrama animado de una habitación con fuente, oyente, sonido directo y reflexiones\"><\/canvas><span class=\"scene-tag\">ANIMACIÓN DEL ESPACIO<\/span><\/div><div class=\"legend\"><span><i class=\"key direct\"><\/i> Sonido directo<\/span><span><i class=\"key reflect\"><\/i> Reflexiones<\/span><\/div>\n<div class=\"compare\"><button class=\"btn\" id=\"dryBtn\">▶ Escuchar seco<\/button><button class=\"btn primary\" id=\"wetBtn\">▶ Escuchar en el espacio<\/button><\/div>\n<div class=\"insight\"><span class=\"bulb\">✦<\/span><span>El <b>sonido directo<\/b> llega primero. Las reflexiones se acumulan y producen una <b>cola reverberante<\/b>.<\/span><\/div><\/section>\n<aside class=\"panel\" aria-label=\"Escucha y compara\"><div class=\"eyebrow\">Escucha primero<\/div><h2>¿Qué cambia?<\/h2><p class=\"control-summary\">Elige una fuente y compárala en tres espacios. Todavía no necesitas modificar controles técnicos.<\/p><div class=\"audio-bar\"><label>FUENTE SONORA<\/label><div class=\"sounds\"><button class=\"sound\" data-sound=\"clap\" aria-pressed=\"true\">👏 Palmada<\/button><button class=\"sound\" data-sound=\"bell\" aria-pressed=\"false\">🔔 Campana<\/button><button class=\"sound\" data-sound=\"impact\" aria-pressed=\"false\">✦ Impacto<\/button><\/div><\/div><h3 style=\"margin-top:17px\">Espacios de ejemplo<\/h3><div class=\"moods\"><button class=\"mood\" data-room=\"small\" aria-pressed=\"false\">Habitación<\/button><button class=\"mood\" data-room=\"medium\" aria-pressed=\"true\">Sala<\/button><button class=\"mood\" data-room=\"large\" aria-pressed=\"false\">Gran espacio<\/button><\/div><div class=\"room-info\" id=\"roomInfo\" aria-live=\"polite\">Sala: cola intermedia<\/div><div class=\"console\"><button class=\"btn small ghost\" id=\"stopBtn\">■ Detener<\/button><\/div><div class=\"status\" id=\"audioStatus\" role=\"status\" aria-live=\"polite\">Pulsa escuchar para activar el audio.<\/div><p class=\"mini-info\">La representación de reflexiones es ilustrativa.<\/p><\/aside><\/main><nav class=\"pager\" aria-label=\"Continuar entre páginas\"><span class=\"subtle\">Inicio · Observa<\/span><span class=\"subtle\">Página 1 de 3<\/span><a class=\"btn small primary\" href=\"#experimenta\">Experimenta →<\/a><\/nav>\n<footer class=\"footnote\">Reverberación · Material educativo experimental · Visualizaciones conceptuales, no mediciones de recintos reales. Audio procesado mediante Web Audio. Sin evaluaciones automáticas.<\/footer><\/div>", "<div class=\"shell\">\n<nav class=\"topline\" aria-label=\"Navegación general\"><a class=\"home-link\" href=\"reverberacion.html\">← Reverberación<\/a><span>Laboratorio interactivo de diseño sonoro<\/span><\/nav>\n<header><div class=\"brand\"><div class=\"mark\" aria-hidden=\"true\">⌁<\/div><div><div class=\"brand-title\">Reverberación<\/div><div class=\"brand-sub\">ESCUCHA · OBSERVA · EXPERIMENTA<\/div><\/div><\/div>\n<div class=\"hero\"><div class=\"eyebrow\">Parte 02 de 03 · Experimenta<\/div><h1 tabindex=\"-1\">Transforma las <em>reflexiones.<\/em><\/h1><p>Cambia el tiempo, la separación y la cantidad de reverberación. Escucha lo que ocurre.<\/p><div class=\"chips\"><span class=\"chip\">🎧 Audífonos recomendados<\/span><span class=\"chip\">◉ Audio procesado en el navegador<\/span><span class=\"chip\">02/03<\/span><\/div><\/div><\/header>\n<nav class=\"steps\" aria-label=\"Páginas de reverberación\"><a class=\"step\" href=\"#observa\" ><span class=\"number\">01<\/span><span>Observa<small>Escucha las reflexiones<\/small><\/span><\/a><a class=\"step\" href=\"#experimenta\" aria-current=\"page\"><span class=\"number\">02<\/span><span>Experimenta<small>Modifica el sonido<\/small><\/span><\/a><a class=\"step\" href=\"#aplica\" ><span class=\"number\">03<\/span><span>Aplica<small>Construye un espacio<\/small><\/span><\/a><\/nav><main class=\"layout\"><section class=\"panel visual-panel\" aria-labelledby=\"head-experiment\"><div class=\"panel-heading\"><div><div class=\"eyebrow\">02 · Experimenta<\/div><h2 id=\"head-experiment\">¿Qué hace cada control?<\/h2><\/div><span class=\"stage-tag\">Tiempo y cantidad<\/span><\/div>\n<div class=\"plot\"><canvas width=\"960\" height=\"340\" id=\"tail-canvas\" role=\"img\" aria-label=\"Gráfica conceptual de reflexiones iniciales y decaimiento de reverberación\"><\/canvas><\/div><div class=\"plot-caption\"><span>Inicio del sonido<\/span><span id=\"tailMark\">Cola: 1,2 s<\/span><\/div>\n<div class=\"insight\"><span class=\"bulb\">✦<\/span><span>Cambia el <b>tiempo<\/b> para alargar la cola. Mueve el <b>pre-delay<\/b> para separar el inicio de la reverberación.<\/span><\/div>\n<div class=\"compare\"><button class=\"btn\" id=\"compareDryBtn\">▶ Original<\/button><button class=\"btn primary\" id=\"compareWetBtn\">▶ Con reverberación<\/button><\/div><div class=\"audio-bar\"><label>FUENTE SONORA<\/label><div class=\"sounds\"><button class=\"sound\" data-sound=\"clap\" aria-pressed=\"true\">👏 Palmada<\/button><button class=\"sound\" data-sound=\"bell\" aria-pressed=\"false\">🔔 Campana<\/button><button class=\"sound\" data-sound=\"impact\" aria-pressed=\"false\">✦ Impacto<\/button><\/div><div class=\"upload\"><label for=\"fileSound\">↑ Importar audio <input accept=\"audio/*\" id=\"fileSound\" type=\"file\"><\/label><span class=\"upload-name\" id=\"fileName\">WAV, MP3…<\/span><\/div><\/div><\/section><aside class=\"panel\" aria-label=\"Controles de reverberación\"><div class=\"eyebrow\">Laboratorio<\/div><h2>Mueve y escucha<\/h2><p class=\"control-summary\">Ajusta un parámetro y vuelve a reproducir.<\/p><h3 style=\"margin-top:17px\">Espacios de ejemplo<\/h3><div class=\"moods\"><button class=\"mood\" data-room=\"small\" aria-pressed=\"false\">Habitación<\/button><button class=\"mood\" data-room=\"medium\" aria-pressed=\"true\">Sala<\/button><button class=\"mood\" data-room=\"large\" aria-pressed=\"false\">Gran espacio<\/button><\/div><div class=\"room-info\" id=\"roomInfo\" aria-live=\"polite\">Sala: cola intermedia<\/div><div class=\"control\"><label for=\"decay\">Tiempo de reverberación <output id=\"decayOut\">1,2 s<\/output><\/label><input type=\"range\" id=\"decay\" min=\"0.2\" max=\"5\" step=\"0.1\" value=\"1.2\"><div class=\"desc\">¿Cuánto dura la cola?<\/div><\/div>\n<div class=\"control\"><label for=\"predelay\">Pre-delay <output id=\"predelayOut\">25 ms<\/output><\/label><input type=\"range\" id=\"predelay\" min=\"0\" max=\"160\" step=\"5\" value=\"25\"><div class=\"desc\">Tiempo antes de las reflexiones.<\/div><\/div>\n<div class=\"control\"><label for=\"wet\">Cantidad de reverberación <output id=\"wetOut\">40 %<\/output><\/label><input type=\"range\" id=\"wet\" min=\"0\" max=\"100\" step=\"1\" value=\"40\"><div class=\"desc\">Original ↔ reverberante.<\/div><\/div>\n<details><summary>Opcional · Absorción de agudos<\/summary><div class=\"control\"><label for=\"damp\">Absorción <output id=\"dampOut\">45 %<\/output><\/label><input type=\"range\" id=\"damp\" min=\"0\" max=\"100\" step=\"1\" value=\"45\"><div class=\"desc\">Mayor absorción: reverberación menos brillante.<\/div><\/div><\/details><div class=\"console\"><button class=\"btn primary\" id=\"playMainBtn\">▶ Probar ajuste<\/button><button class=\"btn ghost small\" id=\"stopBtn\">■ Detener<\/button><\/div><div class=\"status\" id=\"audioStatus\" role=\"status\" aria-live=\"polite\">Mueve un control para comenzar.<\/div><p class=\"hint\">Los ajustes se aplican al iniciar una nueva reproducción.<\/p><\/aside><\/main><nav class=\"pager\" aria-label=\"Continuar entre páginas\"><a class=\"btn small ghost\" href=\"#observa\">← Observa<\/a><span class=\"subtle\">Página 2 de 3<\/span><a class=\"btn small primary\" href=\"#aplica\">Aplica →<\/a><\/nav>\n<footer class=\"footnote\">Reverberación · Material educativo experimental · Visualizaciones conceptuales, no mediciones de recintos reales. Audio procesado mediante Web Audio. Sin evaluaciones automáticas.<\/footer><\/div>", "<div class=\"shell\">\n<nav class=\"topline\" aria-label=\"Navegación general\"><a class=\"home-link\" href=\"reverberacion.html\">← Reverberación<\/a><span>Laboratorio interactivo de diseño sonoro<\/span><\/nav>\n<header><div class=\"brand\"><div class=\"mark\" aria-hidden=\"true\">⌁<\/div><div><div class=\"brand-title\">Reverberación<\/div><div class=\"brand-sub\">ESCUCHA · OBSERVA · EXPERIMENTA<\/div><\/div><\/div>\n<div class=\"hero\"><div class=\"eyebrow\">Parte 03 de 03 · Aplica<\/div><h1 tabindex=\"-1\">Diseña tu <em>propio espacio.<\/em><\/h1><p>Elige un espacio, ajusta el sonido y llévalo después a tu DAW.<\/p><div class=\"chips\"><span class=\"chip\">🎧 Audífonos recomendados<\/span><span class=\"chip\">◉ Audio procesado en el navegador<\/span><span class=\"chip\">03/03<\/span><\/div><\/div><\/header>\n<nav class=\"steps\" aria-label=\"Páginas de reverberación\"><a class=\"step\" href=\"#observa\" ><span class=\"number\">01<\/span><span>Observa<small>Escucha las reflexiones<\/small><\/span><\/a><a class=\"step\" href=\"#experimenta\" ><span class=\"number\">02<\/span><span>Experimenta<small>Modifica el sonido<\/small><\/span><\/a><a class=\"step\" href=\"#aplica\" aria-current=\"page\"><span class=\"number\">03<\/span><span>Aplica<small>Construye un espacio<\/small><\/span><\/a><\/nav><main class=\"layout\"><section class=\"panel visual-panel\" aria-labelledby=\"head-apply\"><div><div class=\"eyebrow\">03 · Aplica<\/div><h2 id=\"head-apply\">Construye el espacio<\/h2><p class=\"subtle\">Elige una situación. No hay una curva perfecta: busca que el resultado comunique el lugar.<\/p><\/div>\n<div class=\"cards\"><button class=\"scenario\" data-scene=\"booth\" aria-pressed=\"true\"><strong>🎙️ Cabina<\/strong><span>Íntima y seca<\/span><\/button><button class=\"scenario\" data-scene=\"hall\" aria-pressed=\"false\"><strong>🚪 Pasillo<\/strong><span>Reflexiones claras<\/span><\/button><button class=\"scenario\" data-scene=\"hangar\" aria-pressed=\"false\"><strong>🚀 Hangar<\/strong><span>Cola prolongada<\/span><\/button><\/div><div class=\"banner\"><strong id=\"goalTitle\">Objetivo: cabina pequeña<\/strong><p id=\"goalText\">Busca un sonido cercano con una cola muy corta.<\/p><\/div>\n<div class=\"scene\"><canvas id=\"mission-canvas\" width=\"960\" height=\"540\" ro   function drawTail(){const canvas=$('tail-canvas');if(!canvas)return;const c=canvas.getContext('2d'),w=canvas.width,h=canvas.height;c.clearRect(0,0,w,h);c.fillStyle='#091725';c.fillRect(0,0,w,h);const padL=64,padT=40,padB=55,padR=26,right=w-padR,bottom=h-padB,span=right-padL;c.strokeStyle='#254158';c.lineWidth=1;c.font='600 17px system-ui';c.fillStyle='#94bbcb';for(let k=0;k<5;k++){const y=padT+k*(bottom-padT)/4;line(c,padL,y,right,y,'#2a4960');c.fillText(`${-k*15} dB`,9,y+6)}for(let k=0;k<6;k++){const x=padL+k*span/5;line(c,x,padT,x,bottom,'#20364b');c.fillText(`${fmt(k*1.2)} s`,x-20,bottom+27)}const duration=6,pred=state.predelay/1000,decay=state.decay,xAt=t=>padL+span*t/duration;c.beginPath();c.moveTo(padL,bottom);for(let i=0;i<=280;i++){const t=i*duration/280,db=t<pred?-60:-Math.min(60,60*(t-pred)/decay),y=padT+(Math.abs(db)/60)*(bottom-padT);c.lineTo(xAt(t),y)}c.lineTo(right,bottom);c.closePath();const grad=c.createLinearGradient(0,padT,0,bottom);grad.addColorStop(0,'#5fe6d933');grad.addColorStop(1,'#5fe6d908');c.fillStyle=grad;c.fill();c.beginPath();for(let i=0;i<=280;i++){const t=i*duration/280,db=t<pred?-60:-Math.min(60,60*(t-pred)/decay),y=padT+(Math.abs(db)/60)*(bottom-padT);if(!i)c.moveTo(xAt(t),y);else c.lineTo(xAt(t),y)}c.strokeStyle='#6fe8d7';c.lineWidth=4;c.stroke();line(c,padL,padT,padL,bottom,'#ffd37b',4);c.fillStyle='#ffd37b';c.fillText('Directo',padL+10,padT+10);[.03,.05,.07,.10].forEach((t,i)=>{const at=xAt(pred+t),height=(1-i*.16)*(bottom-padT)*.46;line(c,at,bottom,at,bottom-height,'#63b4e7',4)});c.fillStyle='#8ad2f4';c.fillText('Reflexiones',xAt(Math.min(2,pred+.1))+15,bottom-25);c.fillStyle='#b4e9de';c.fillText('Cola reverberante',xAt(Math.max(1,Math.min(3,pred+decay/2))),padT+72)}
  function draw(){drawRoom($('room-canvas'));drawRoom($('mission-canvas'));drawTail()}
  function tick(){if(destruido) return; if($('room-canvas'))drawRoom($('room-canvas'));if($('mission-canvas'))drawRoom($('mission-canvas'));requestAnimationFrame(tick)}
  const ocultarReverberacion=()=>{if(document.hidden&&state.sourceNodes.length)stop()}; document.addEventListener('visibilitychange',ocultarReverberacion);
  syncSliders();if(!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)&&($('room-canvas')||$('mission-canvas')))requestAnimationFrame(tick);
  window.__finalizarReverberacion = () => {
    destruido = true;
    stop();
    try { state.audio?.close(); } catch (_) {}
    document.removeEventListener('visibilitychange', ocultarReverberacion);
  };
}

function mostrarPagina(n) {
  if (!Number.isInteger(n) || n<0 || n>2 || n===selectedPage) return;
  if (typeof window.__finalizarReverberacion === 'function') window.__finalizarReverberacion();
  selectedPage=n;
  document.body.dataset.page=String(n);
  document.getElementById('page-host').innerHTML=REV_PAGES[n];
  document.title='Audio Pedagógico · Reverberación · '+['Observa','Experimenta','Aplica'][n];
  iniciarReverberacion();
  window.scrollTo(0,0);
}
// Cambio por clic directo: funciona incluso si el visor restringe la navegación.
document.getElementById('page-host').addEventListener('click',e=>{
  const enlace=e.target.closest('a[href^="#"]');
  if(!enlace) return;
  const destino=REV_NAMES.indexOf(enlace.getAttribute('href').slice(1));
  if(destino<0) return;
  e.preventDefault();
  if (destino === selectedPage) return;
  try {
    history.pushState(null, '', enlace.hash);
  } catch (_) {
    // Algunos visores locales restringen el historial.
  }
  mostrarPagina(destino);
  document.querySelector('.hero h1').focus({preventScroll: true});
});
window.addEventListener('hashchange',()=>{
  const destination=REV_NAMES.indexOf(location.hash.slice(1).toLowerCase());
  mostrarPagina(destination<0?0:destination);
});
const initial=REV_NAMES.indexOf(location.hash.slice(1).toLowerCase());
mostrarPagina(initial<0?0:initial);
</script></body></html>
